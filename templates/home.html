<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Oficina</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #020617);
            color: white;
        }

        .header {
            text-align: center;
            margin-top: 50px;
        }

        .header h1 {
            font-weight: 700;
        }

        .header p {
            color: #94a3b8;
        }

        .card {
            border: none;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.1);
        }

        .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .card-title {
            font-weight: 600;
        }

        a {
            text-decoration: none;
            color: white;
        }

        .grid {
            margin-top: 50px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🚗 Sistema de Oficina</h1>
        <p>Painel de controle da sua oficina</p>
    </div>

    <div class="row grid g-4">

        <div class="col-md-4">
            <a href="/clientes">
                <div class="card text-center p-4">
                    <div class="icon">👤</div>
                    <h5 class="card-title">Clientes</h5>
                    <p class="text-secondary">Gerenciar clientes</p>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="/mecanicos">
                <div class="card text-center p-4">
                    <div class="icon">🔧</div>
                    <h5 class="card-title">Mecânicos</h5>
                    <p class="text-secondary">Equipe da oficina</p>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="/pecas">
                <div class="card text-center p-4">
                    <div class="icon">📦</div>
                    <h5 class="card-title">Peças</h5>
                    <p class="text-secondary">Controle de estoque</p>
                </div>
            </a>
        </div>

        <div class="col-md-6">
            <a href="/os">
                <div class="card text-center p-4">
                    <div class="icon">📋</div>
                    <h5 class="card-title">Ordens de Serviço</h5>
                    <p class="text-secondary">Gerenciar serviços</p>
                </div>
            </a>
        </div>

        <div class="col-md-6">
            <a href="/os/nova">
                <div class="card text-center p-4">
                    <div class="icon">➕</div>
                    <h5 class="card-title">Nova OS</h5>
                    <p class="text-secondary">Abrir nova ordem</p>
                </div>
            </a>
        </div>

    </div>

</div>

</body>
</html>
