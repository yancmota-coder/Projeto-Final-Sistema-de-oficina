<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Oficina</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        .card {
            border: none;
            border-radius: 15px;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .title {
            margin-top: 40px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 class="title">🚗 Sistema de Oficina</h1>
    <p class="text-center">Gerencie tudo em um só lugar</p>

    <div class="row mt-5 g-4">

        <div class="col-md-4">
            <a href="/clientes" class="text-decoration-none">
                <div class="card bg-primary text-center p-4">
                    <h3>👤 Clientes</h3>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="/mecanicos" class="text-decoration-none">
                <div class="card bg-success text-center p-4">
                    <h3>🔧 Mecânicos</h3>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="/pecas" class="text-decoration-none">
                <div class="card bg-warning text-dark text-center p-4">
                    <h3>📦 Peças</h3>
                </div>
            </a>
        </div>

        <div class="col-md-6">
            <a href="/os" class="text-decoration-none">
                <div class="card bg-danger text-center p-4">
                    <h3>📋 Ordens de Serviço</h3>
                </div>
            </a>
        </div>

        <div class="col-md-6">
            <a href="/os/nova" class="text-decoration-none">
                <div class="card bg-info text-dark text-center p-4">
                    <h3>➕ Nova OS</h3>
                </div>
            </a>
        </div>

    </div>

</div>

</body>
</html>
