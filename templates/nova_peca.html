<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nova Peça</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        .card {
            border-radius: 15px;
        }

        .container-box {
            max-width: 500px;
            margin: auto;
            margin-top: 60px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="container-box">
        <div class="card bg-dark p-4">

            <h2 class="text-center mb-4">📦 Nova Peça</h2>

            <form action="/pecas/criar" method="post">

                <div class="mb-3">
                    <label>Nome</label>
                    <input class="form-control" name="nome" placeholder="Nome da peça" required>
                </div>

                <div class="mb-3">
                    <label>Código</label>
                    <input class="form-control" name="codigo" placeholder="Código da peça">
                </div>

                <div class="mb-3">
                    <label>Quantidade em Estoque</label>
                    <input class="form-control" type="number" name="quantidade_estoque" placeholder="0" required>
                </div>

                <div class="mb-3">
                    <label>Preço de Venda</label>
                    <input class="form-control" type="number" step="0.01" name="preco_venda" placeholder="0.00" required>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="/pecas" class="btn btn-secondary">⬅ Voltar</a>
                    <button type="submit" class="btn btn-success">Salvar</button>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
