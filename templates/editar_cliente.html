<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Cliente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        .card {
            border-radius: 15px;
        }

        .container-box {
            max-width: 500px;
            margin: auto;
            margin-top: 60px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="container-box">
        <div class="card bg-dark p-4">

            <h2 class="text-center mb-4">✏️ Editar Cliente</h2>

            <form action="/clientes/atualizar/{{cliente.id}}" method="post">

                <div class="mb-3">
                    <label>Nome</label>
                    <input class="form-control" name="nome" value="{{cliente.nome}}" required>
                </div>

                <div class="mb-3">
                    <label>Telefone</label>
                    <input class="form-control" name="telefone" value="{{cliente.telefone}}">
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input class="form-control" name="email" value="{{cliente.email}}">
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="/clientes" class="btn btn-secondary">⬅ Voltar</a>
                    <button class="btn btn-success">Atualizar</button>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
