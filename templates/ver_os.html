<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>OS #{{os.id}}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        .card {
            border-radius: 15px;
        }

        .container-box {
            max-width: 900px;
            margin: auto;
            margin-top: 40px;
        }

        .total-box {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4dff88;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="container-box">

        <!-- INFO OS -->
        <div class="card bg-dark p-4 mb-4">

            <h2>📋 OS #{{os.id}}</h2>

            <p><b>Cliente:</b> {{os.cliente}}</p>
            <p><b>Veículo:</b> 🚗 {{os.veiculo}}</p>
            <p><b>Mecânico:</b> 🔧 {{os.mecanico}}</p>

        </div>

        <!-- ITENS -->
        <div class="card bg-dark p-4 mb-4">

            <h4>🧾 Itens</h4>

            <ul class="list-group">
                {% for i in itens %}
                <li class="list-group-item bg-dark text-white">
                    {{i.descricao}} - {{i.quantidade}}x 
                    <span class="float-end">R$ {{i.valor_total}}</span>
                </li>
                {% endfor %}
            </ul>

            <div class="mt-3 total-box">
                💰 Total: R$ {{total}}
            </div>

        </div>

        <!-- ADICIONAR PEÇA -->
        <div class="card bg-dark p-4 mb-4">

            <h4>➕ Adicionar Peça</h4>

            <form action="/os/{{os.id}}/add-peca" method="post">

                <div class="mb-3">
                    <label>Peça</label>
                    <select class="form-control" name="peca_id">
                        {% for p in pecas %}
                        <option value="{{p.id}}">
                            {{p.nome}} ({{p.quantidade_estoque}} em estoque)
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label>Quantidade</label>
                    <input class="form-control" type="number" name="quantidade" required>
                </div>

                <button class="btn btn-warning">Adicionar Peça</button>

            </form>

        </div>

        <!-- ADICIONAR SERVIÇO -->
        <div class="card bg-dark p-4">

            <h4>🛠️ Adicionar Serviço</h4>

            <form action="/os/{{os.id}}/add-servico" method="post">

                <div class="mb-3">
                    <label>Descrição</label>
                    <input class="form-control" name="descricao" required>
                </div>

                <div class="mb-3">
                    <label>Valor</label>
                    <input class="form-control" type="number" step="0.01" name="valor" required>
                </div>

                <button class="btn btn-success">Adicionar Serviço</button>

            </form>

        </div>

        <!-- VOLTAR -->
        <div class="mt-4 text-center">
            <a href="/os" class="btn btn-secondary">⬅ Voltar</a>
        </div>

    </div>

</div>

</body>
</html>
