<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Peças</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        .card {
            border-radius: 15px;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }

        .estoque-baixo {
            color: #ff4d4d;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top-bar">
        <h1>📦 Peças</h1>
        <div>
            <a href="/" class="btn btn-secondary">🏠 Home</a>
            <a href="/pecas/novo" class="btn btn-primary">➕ Nova Peça</a>
        </div>
    </div>

    <div class="row mt-4 g-4">

        {% for p in pecas %}
        <div class="col-md-4">
            <div class="card bg-dark p-3">

                <h5>{{p.nome}}</h5>
                <p>💰 R$ {{p.preco_venda}}</p>

                <p>
                    📦 Estoque: {{p.quantidade_estoque}}
                    {% if p.quantidade_estoque <= 5 %}
                        <span class="estoque-baixo">⚠️ Baixo</span>
                    {% endif %}
                </p>

                <div class="d-flex justify-content-between mt-3">
                    <a href="/pecas/editar/{{p.id}}" class="btn btn-warning btn-sm">Editar</a>
                    <a href="/pecas/deletar/{{p.id}}" class="btn btn-danger btn-sm">Excluir</a>
                </div>

            </div>
        </div>
        {% endfor %}

    </div>

</div>

</body>
</html>
