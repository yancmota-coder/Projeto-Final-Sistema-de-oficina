<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mecânicos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        .card {
            border-radius: 15px;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top-bar">
        <h1>🔧 Mecânicos</h1>
        <div>
            <a href="/" class="btn btn-secondary">🏠 Home</a>
            <a href="/mecanicos/novo" class="btn btn-primary">➕ Novo Mecânico</a>
        </div>
    </div>

    <div class="row mt-4 g-4">

        {% for m in mecanicos %}
        <div class="col-md-4">
            <div class="card bg-dark p-3">

                <h5>{{m.nome}}</h5>
                <p>🛠️ {{m.especialidade}}</p>

                <div class="d-flex justify-content-between mt-3">
                    <a href="/mecanicos/editar/{{m.id}}" class="btn btn-warning btn-sm">Editar</a>
                    <a href="/mecanicos/deletar/{{m.id}}" class="btn btn-danger btn-sm">Excluir</a>
                </div>

            </div>
        </div>
        {% endfor %}

    </div>

</div>

</body>
</html>
