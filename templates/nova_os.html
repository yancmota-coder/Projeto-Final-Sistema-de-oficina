<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nova Ordem de Serviço</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        .card {
            border-radius: 15px;
        }

        .container-box {
            max-width: 600px;
            margin: auto;
            margin-top: 60px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="container-box">
        <div class="card bg-dark p-4">

            <h2 class="text-center mb-4">📋 Nova Ordem de Serviço</h2>

            <form action="/os/criar" method="post">

                <div class="mb-3">
                    <label>Cliente</label>
                    <select class="form-control" name="cliente_id" required>
                        {% for c in clientes %}
                        <option value="{{c.id}}">{{c.nome}}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label>Veículo</label>
                    <select class="form-control" name="veiculo_id" required>
                        {% for v in veiculos %}
                        <option value="{{v.id}}">{{v.modelo}} - {{v.placa}}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label>Mecânico</label>
                    <select class="form-control" name="mecanico_id" required>
                        {% for m in mecanicos %}
                        <option value="{{m.id}}">{{m.nome}}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label>Problema Relatado</label>
                    <textarea class="form-control" name="problema" rows="3" placeholder="Descreva o problema..." required></textarea>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="/os" class="btn btn-secondary">⬅ Voltar</a>
                    <button type="submit" class="btn btn-success">Criar OS</button>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
