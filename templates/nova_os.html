<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nova Ordem de Serviço</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        .card {
            border-radius: 15px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top-bar">
        <h1>📋 Nova OS</h1>
        <div>
            <a href="/os" class="btn btn-secondary">⬅ Voltar</a>
        </div>
    </div>

    <div class="card bg-dark p-4 mt-4">

        <form method="POST" action="/os/criar">

            <div class="mb-3">
                <label>Cliente</label>
                <select name="cliente_id" class="form-control">
                    {% for c in clientes %}
                        <option value="{{c.id}}">{{c.nome}}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label>Veículo</label>
                <select name="veiculo_id" class="form-control">
                    {% for v in veiculos %}
                        <option value="{{v.id}}">
                            {{v.modelo}} - {{v.placa}}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label>Mecânico</label>
                <select name="mecanico_id" class="form-control">
                    {% for m in mecanicos %}
                        <option value="{{m.id}}">{{m.nome}}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label>Problema relatado</label>
                <textarea name="problema_relatado" class="form-control" rows="3"></textarea>
            </div>

            <button class="btn btn-primary w-100">🚀 Criar OS</button>

        </form>

    </div>

</div>

</body>
</html>
