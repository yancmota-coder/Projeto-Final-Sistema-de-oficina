<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        .card {
            border-radius: 15px;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top-bar">
        <h1>👤 Clientes</h1>
        <div>
            <a href="/" class="btn btn-secondary">🏠 Home</a>
            <a href="/clientes/novo" class="btn btn-primary">➕ Novo Cliente</a>
        </div>
    </div>

    <div class="row mt-4 g-4">

        {% for c in clientes %}
        <div class="col-md-4">
            <div class="card bg-dark p-3">

                <h5>{{c.nome}}</h5>
                <p>📞 {{c.telefone}}</p>

                {% if c.marca %}
                    <p>🚗 {{c.marca}} - {{c.modelo}}</p>
                {% else %}
                    <p><i>Sem veículo</i></p>
                {% endif %}

                <div class="d-flex justify-content-between mt-3">
                    <a href="/clientes/editar/{{c.id}}" class="btn btn-warning btn-sm">Editar</a>
                    <a href="/clientes/deletar/{{c.id}}" class="btn btn-danger btn-sm">Excluir</a>
                </div>

                <a href="/clientes/{{c.id}}/veiculos/novo" class="btn btn-info btn-sm mt-2">
                    ➕ Veículo
                </a>

            </div>
        </div>
        {% endfor %}

    </div>

</div>

</body>
</html>
