<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>OS Concluídas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        .card {
            border-radius: 15px;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.02);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }

        .status-concluida {
            color: #4dff88;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top-bar">
        <h1>✅ OS Concluídas</h1>
        <div>
            <a href="/" class="btn btn-secondary">🏠 Home</a>
            <a href="/os" class="btn btn-primary">📋 Todas OS</a>
        </div>
    </div>

    <div class="row mt-4 g-4">

        {% for os in ordens %}
        <div class="col-md-4">
            <div class="card bg-dark p-3">

                <h5>👤 {{os.cliente}}</h5>

                <p>
                    Status:
                    <span class="status-concluida">🟢 CONCLUÍDA</span>
                </p>

                <a href="/os/{{os.id}}" class="btn btn-info btn-sm mt-2">
                    Ver Detalhes
                </a>

            </div>
        </div>
        {% endfor %}

    </div>

</div>

</body>
</html>
