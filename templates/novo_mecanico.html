<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Mecânico</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        .card {
            border-radius: 15px;
        }

        .container-box {
            max-width: 500px;
            margin: auto;
            margin-top: 60px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="container-box">
        <div class="card bg-dark p-4">

            <h2 class="text-center mb-4">🔧 Novo Mecânico</h2>

            <form action="/mecanicos/criar" method="post">

                <div class="mb-3">
                    <label>Nome</label>
                    <input class="form-control" name="nome" placeholder="Nome do mecânico" required>
                </div>

                <div class="mb-3">
                    <label>Especialidade</label>
                    <input class="form-control" name="especialidade" placeholder="Ex: Motor, Freio, Elétrica...">
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="/mecanicos" class="btn btn-secondary">⬅ Voltar</a>
                    <button type="submit" class="btn btn-success">Salvar</button>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
