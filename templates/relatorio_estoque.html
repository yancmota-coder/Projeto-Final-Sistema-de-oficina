<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Estoque Baixo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        .card {
            border-radius: 15px;
            transition: 0.3s;
            border: 1px solid #ff4d4d;
        }

        .card:hover {
            transform: scale(1.02);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }

        .alerta {
            color: #ff4d4d;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top-bar">
        <h1>⚠️ Estoque Baixo</h1>
        <div>
            <a href="/" class="btn btn-secondary">🏠 Home</a>
            <a href="/pecas" class="btn btn-primary">📦 Todas Peças</a>
        </div>
    </div>

    <div class="row mt-4 g-4">

        {% for p in pecas %}
        <div class="col-md-4">
            <div class="card bg-dark p-3">

                <h5>{{p.nome}}</h5>

                <p>
                    📦 Quantidade:
                    <span class="alerta">{{p.quantidade_estoque}}</span>
                </p>

                <p class="alerta">⚠️ Repor estoque urgente</p>

                <a href="/pecas/editar/{{p.id}}" class="btn btn-warning btn-sm mt-2">
                    Atualizar Estoque
                </a>

            </div>
        </div>
        {% endfor %}

    </div>

</div>

</body>
</html>
